<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta
      name="description"
      content="Delegate the work, schedule it to repeat. It learns from every conversation. On any model, on your own key."
    />
    <meta name="application-name" content="%APP_NAME%" />
    <meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nadi: Your AI coworker.</title>

    <!-- Link unfurls. The card is rendered from the real design system via
         preview.html?screen=og, so it can't drift from the page it advertises. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nadi" />
    <meta property="og:url" content="https://nadiai.app/" />
    <meta property="og:title" content="Nadi: Your AI coworker." />
    <meta
      property="og:description"
      content="Delegate the work, schedule it to repeat. It learns from every conversation. On any model, on your own key."
    />
    <meta property="og:image" content="https://nadiai.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nadi: your AI coworker." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nadi: Your AI coworker." />
    <meta
      name="twitter:description"
      content="Delegate the work, schedule it to repeat. It learns from every conversation. On any model, on your own key."
    />
    <meta name="twitter:image" content="https://nadiai.app/og.png" />
    <script>
      // Set the theme before first paint to avoid a flash. With nothing stored we
      // follow the OS — keep this default in step with DEFAULT_THEME in lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem("nadi-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#15120d");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
