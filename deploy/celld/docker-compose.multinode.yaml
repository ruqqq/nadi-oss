# Nadi on a celld CLUSTER — one copy of this stack per host.
#
# UNTESTED. The single-node docker-compose.yaml in this directory has been run
# end to end; this file has not. It is a starting point derived from celld's
# documented flags, not a proven recipe. Read README.md before using it, and
# expect to debug.
#
#   cp .env.multinode.example .env.multinode   # then edit, PER HOST
#   cp celld-vars.env.example celld-vars.env   # identical on every host
#
#   # once, from any host:
#   docker compose -f docker-compose.multinode.yaml --env-file .env.multinode \
#     --profile deploy run --rm deploy
#
#   # on every host:
#   docker compose -f docker-compose.multinode.yaml --env-file .env.multinode up -d
#
# Every host runs a full copy: one celld node plus its own Caddy. Any node can
# answer any request — celld routes internally to whichever node currently owns
# the cell — so the load balancer in front needs NO session affinity, and
# WebSockets work through a plain round-robin. That is the property this whole
# layout is built on.
#
# There is no bundled MinIO here on purpose. Every node must reach the SAME
# fleet bucket, so S3 has to be external (R2, AWS, or a MinIO cluster of its
# own). A per-host MinIO would give you N isolated apps that silently ignore
# each other.

name: nadi-celld-node

services:
  # One-shot, run from ONE host only. Uploads the Worker bundle to the fleet
  # bucket, which records a single current deployment for the whole cluster.
  # Nodes read a deployment at startup only, so this changes nothing until you
  # restart them — see the rolling-restart section of README.md.
  deploy:
    profiles: [deploy]
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: deployer
    command: ["--bucket", "${CELLD_BUCKET}", "--endpoint", "${S3_ENDPOINT_INTERNAL}"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}

  # One-shot: applies migrations/ to the registry D1 database.
  #
  # ORDER MATTERS, and it is the reverse of what you may expect. A celld D1
  # database is a CELL, so `celld d1` needs a RUNNING fleet to talk to — it
  # finds a node through the node leases in the bucket and asks that node to
  # route the work to the database's owner. So the sequence is deploy, then
  # up, THEN migrate; a migrate before `up` fails with no node to reach.
  #
  # Re-run after every schema change. celld records applied migrations in the
  # `d1_migrations` table exactly as `wrangler d1 migrations` does, so this is
  # idempotent and safe to run on every deploy.
  migrate:
    profiles: [migrate]
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: deployer
    entrypoint: ["celld"]
    command:
      [
        "d1",
        "migrations",
        "apply",
        "nadi-registry",
        "--bucket",
        "${CELLD_BUCKET}",
        "--endpoint",
        "${S3_ENDPOINT_INTERNAL}",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      - celld

  celld:
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: node
    restart: unless-stopped
    command:
      - "--bucket"
      - "${CELLD_BUCKET}"
      - "--endpoint"
      - "${S3_ENDPOINT_INTERNAL}"
      - "--listen"
      - "0.0.0.0:8080"
      # Since v0.2.0 peers and the operator API have their OWN port, separate
      # from the public Worker listener above. This is the one that carries
      # cluster traffic, so it is the one published below.
      - "--internal-listen"
      - "0.0.0.0:8081"
      # THE per-host value, and the one thing most likely to be wrong. Peers
      # read this out of the fleet bucket and dial it directly, so it must be
      # an address reachable from the OTHER hosts — not a Docker service name —
      # and it must name the INTERNAL port (8081), not the public one. The
      # single-node file omits it entirely, because it has no peers.
      - "--advertise"
      - "${CELLD_ADVERTISE}"
      # celld v0.2.1 stopped trusting X-Forwarded-* by default. Without this
      # request.url carries celld's own http://celld:8080 rather than the
      # public https:// origin Caddy terminated. Safe here precisely because
      # Caddy REPLACES both headers on every proxied request (the header_up
      # lines in the Caddyfile), so a client cannot forge either one. Do NOT
      # set this on a node that is reachable without a proxy in front.
      - "--trust-forwarded-headers"
    ports:
      # Peer traffic is unencrypted, and the operator API on this same port
      # permits unauthenticated eviction, state inspection and shutdown. (celld
      # refuses a public advertise address without --unsafe-public-advertise,
      # and that flag is named honestly.) Bind it to the PRIVATE interface
      # only. Never 0.0.0.0 here: this port speaks for the whole cluster's
      # storage. The public 8080 stays unpublished — Caddy reaches it over the
      # compose network.
      - "${PEER_BIND_IP}:8081:8081"
    environment:
      CELLD_VARS_FILE: /etc/nadi/celld-vars.env
      # Two knobs decide how much a node dying costs, and they compound:
      # a peer takes over after the dead node's lease expires (TTL), and
      # restores each cell from its last replication (IDLE_EVICT). Everything
      # written in between is discarded silently. See README.md.
      CELLD_TTL_MS: ${CELLD_TTL_MS:-10000}
      CELLD_IDLE_EVICT_S: ${CELLD_IDLE_EVICT_S:-15}
      # `release` lets a loaded node hand cells to a quieter peer instead of
      # shedding under pressure — the multi-node-only behaviour. `sticky`
      # keeps them local, which is what you want with one node.
      CELLD_PRESSURE_OWNERSHIP: ${CELLD_PRESSURE_OWNERSHIP:-release}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      # Identical on every host. A node that disagrees with its peers about
      # BETTER_AUTH_SECRET or the KEK will serve sessions and secrets the
      # others cannot read, and the failure looks like random sign-outs.
      - ./celld-vars.env:/etc/nadi/celld-vars.env:ro
    # Larger than the single-node file, and for a reason that only exists here.
    # A v0.4.0 node hands its cells to a PEER on the way out, and it claims a
    # fleet-wide drain token first so two nodes cannot hand off at once. The
    # budget is CELLD_DRAIN_TOKEN_WAIT_MS (30s default, left alone here because
    # there ARE other donors) plus CELLD_SHUTDOWN_TOTAL_MS (40s). A grace under
    # that SIGKILLs a node mid-handoff, which is the one thing the handoff is
    # for.
    stop_grace_period: 120s
    healthcheck:
      test:
        ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/.well-known/celld/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  # Serves the SPA and proxies the Worker's routes to the LOCAL node. Reuses
  # the single-node Caddyfile unchanged: `reverse_proxy celld:8080` resolves to
  # this host's node, which is correct — it can serve any request.
  #
  # The Caddyfile's S3 block is inert here (no `minio` service to route to)
  # and its site address is only reached if you point S3_SITE at this host,
  # which you should not with external S3.
  caddy:
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: web-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NADI_SITE: ${NADI_SITE}
      ARTIFACTS_SITE: ${ARTIFACTS_SITE}
      S3_SITE: ${S3_SITE}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - celld

# No named volumes, for the same reason as the single-node file: persistent
# state lives under ./data/ where `docker compose down -v` cannot reach it.
# Note that here ./data/ holds only Caddy's certificates — the durable copy of
# your application data is the external fleet bucket.
