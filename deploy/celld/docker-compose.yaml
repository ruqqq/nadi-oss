# Nadi on celld, packaged — SINGLE NODE. See README.md in this directory for
# how to operate it, and docs/self-hosting-celld.md for what each knob buys you
# — especially the "Operating" section, which is not optional reading.
#
# For more than one node, see docker-compose.multinode.yaml. Read the failover
# section of README.md first: a second node buys availability, not durability.
#
#   cp .env.example .env && cp celld-vars.env.example celld-vars.env   # then edit both
#   docker compose --profile minio up -d          # only if you want bundled MinIO
#   docker compose run --rm deploy                # push the Worker bundle
#   docker compose up -d                          # start the node + proxy
#   docker compose run --rm migrate               # apply migrations/ to the registry
#
# The migrate step comes LAST and it is not optional on a new deployment: the
# registry D1 database is a cell, so `celld d1` needs a running node to reach
# it. Re-run it after any schema change.
#
# Shut down with ./drain-stop.sh, NOT `docker compose down`. celld replicates a
# cell to the bucket only when that cell goes idle, so stopping the node while
# traffic is live discards everything written since the last eviction.

name: nadi-celld

services:
  # One-shot: bundles the Worker and uploads it to the fleet bucket. Re-run
  # after every code change, then restart `celld` — nodes read a deployment at
  # startup only, so a deploy alone changes nothing.
  deploy:
    profiles: [deploy]
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: deployer
    command: ["--bucket", "${CELLD_BUCKET}", "--endpoint", "${S3_ENDPOINT_INTERNAL}"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      minio:
        condition: service_healthy
        required: false

  # One-shot: applies migrations/ to the registry D1 database.
  #
  # ORDER MATTERS, and it is the reverse of what you may expect. A celld D1
  # database is a CELL, so `celld d1` needs a RUNNING fleet to talk to — it
  # finds a node through the node leases in the bucket and asks that node to
  # route the work to the database's owner. So the sequence is deploy, then
  # up, THEN migrate; a migrate before `up` fails with no node to reach.
  #
  # Re-run after every schema change. celld records applied migrations in the
  # `d1_migrations` table exactly as `wrangler d1 migrations` does, so this is
  # idempotent and safe to run on every deploy.
  migrate:
    profiles: [migrate]
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: deployer
    entrypoint: ["celld"]
    command:
      [
        "d1",
        "migrations",
        "apply",
        "nadi-registry",
        "--bucket",
        "${CELLD_BUCKET}",
        "--endpoint",
        "${S3_ENDPOINT_INTERNAL}",
      ]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      - celld

  celld:
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: node
    restart: unless-stopped
    command:
      - "--bucket"
      - "${CELLD_BUCKET}"
      - "--endpoint"
      - "${S3_ENDPOINT_INTERNAL}"
      # 0.0.0.0 inside the container, and deliberately NOT published to the
      # host: Caddy is the only thing that should reach it.
      - "--listen"
      - "0.0.0.0:8080"
      # celld REFUSES to start on an unspecified listen address without an
      # explicit internal listener: since v0.2.0 the public listener carries
      # only the Worker's routes, and peer traffic plus the operator API
      # (/state, /shutdown) live on a second port. That API is UNAUTHENTICATED
      # — it can evict cells and stop the node — so bind it to loopback INSIDE
      # the container, where nothing else on the compose network can dial it.
      # There are no peers in the single-node posture this deployment is built
      # around, so no --advertise is needed at all.
      - "--internal-listen"
      - "127.0.0.1:8081"
      # celld v0.2.1 stopped trusting X-Forwarded-* by default. Without this
      # request.url carries celld's own http://celld:8080 rather than the
      # public https:// origin Caddy terminated. Safe here precisely because
      # Caddy REPLACES both headers on every proxied request (the header_up
      # lines in the Caddyfile), so a client cannot forge either one. Do NOT
      # set this on a node that is reachable without a proxy in front.
      - "--trust-forwarded-headers"
    environment:
      CELLD_VARS_FILE: /etc/nadi/celld-vars.env
      # How long a quiet cell stays resident. Keep it HIGH: an evicted thread
      # cell restores its whole transcript from the bucket on the next message,
      # re-discovers its MCP servers, and drops its hibernatable WebSockets.
      # The old "stay under the 60s tick" rule was a v0.1.0 constraint and no
      # longer holds — see the long note in .env.example.
      CELLD_IDLE_EVICT_S: ${CELLD_IDLE_EVICT_S:-300}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./celld-vars.env:/etc/nadi/celld-vars.env:ro
    # Long enough to replicate on the way out IF celld quiesces on SIGTERM.
    # Whether it does is unverified — do not rely on it. drain-stop.sh does not.
    stop_grace_period: 60s
    depends_on:
      minio:
        condition: service_healthy
        required: false

  caddy:
    build:
      context: ../..
      dockerfile: deploy/celld/Dockerfile
      target: web-server
      args:
        # Only needed when this deployment is installed as a PWA alongside
        # another one; see .env.example. Changing it requires a rebuild
        # (`docker compose build caddy`), not just a restart.
        APP_NAME: ${APP_NAME:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NADI_SITE: ${NADI_SITE}
      ARTIFACTS_SITE: ${ARTIFACTS_SITE}
      S3_SITE: ${S3_SITE}
      ACME_EMAIL: ${ACME_EMAIL}
      # Load-bearing: the Caddyfile's S3 block matches on this to expose ONLY
      # the attachments bucket. Unset, the placeholder expands to nothing and
      # the matcher silently matches no request at all.
      S3_ATTACHMENTS_BUCKET_NAME: ${S3_ATTACHMENTS_BUCKET_NAME}
    networks:
      default:
        aliases:
          # Makes the browser-facing S3 hostname resolve to Caddy from INSIDE
          # the network too, so S3_ENDPOINT is a single value that works for
          # both the browser and the Worker. SigV4 signs the Host header, so it
          # has to be a single value. See the S3 block in the Caddyfile.
          - ${S3_HOSTNAME}
    volumes:
      # Live-mounted rather than baked in, so a routing change is a restart
      # instead of an image rebuild. The image still carries a copy.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist the certificates. Without this every recreate re-issues, and
      # Let's Encrypt rate-limits you out after a handful.
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - celld

  # Optional bundled S3. Omit the profile and point CELLD_BUCKET / S3_* at R2,
  # AWS, or any other S3-compatible service instead.
  minio:
    profiles: [minio]
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      # A bind mount, NOT a named volume: this directory is the durable copy of
      # the registry, every thread's history, and your workspace secrets. On a
      # host path it survives `docker compose down -v`, is visible to `ls`, and
      # is trivially backed up. A named volume is none of those things.
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates both buckets, then exits.
  minio-init:
    profiles: [minio]
    image: minio/mc:latest
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing local/${CELLD_FLEET_BUCKET} &&
        mc mb --ignore-existing local/${S3_ATTACHMENTS_BUCKET_NAME}
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      minio:
        condition: service_healthy

# No named volumes. Every piece of persistent state is a bind mount under
# ./data/ so that `docker compose down -v` — the command that silently destroys
# a named-volume setup — cannot touch it.
