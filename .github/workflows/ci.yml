name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (worker)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Mock isolation
        run: pnpm run check:mock-isolation

      # The real wrangler.prod.jsonc is gitignored, so the example template is
      # the only deploy config CI can see. A binding that exists in one file and
      # not the other means someone's first deploy fails at runtime.
      - name: Wrangler config parity
        run: pnpm run check:wrangler

      # celld serves no static files, so Caddy owns the static/Worker split. A
      # route added to src/index.ts but not to the Caddyfile is answered with
      # the SPA shell and a 200 — no 404, nothing in any log.
      - name: celld proxy routes cover src/index.ts
        run: pnpm run check:celld-proxy

      - name: Format check
        run: pnpm run fmt:check

      - name: Typecheck (web)
        run: pnpm run web:typecheck

      # CI never built the web app: the only build lived in deploy.yml, so a
      # build-time break passed CI and failed at deploy. This also makes
      # web/dist/ exist, which is what lets the mock-isolation dist assertion
      # run — the isolation check above stays first so a mock leak fails fast.
      - name: Build (web)
        run: pnpm run web:build

      # These two steps must between them name every project in
      # vitest.config.ts, or the unnamed ones silently stop running. Vitest only
      # hard-errors on a project filter that matches nothing when NO other
      # filter matches either; alongside a valid one it is silently dropped and
      # the run still exits 0. A stale filter naming a long-gone project sat
      # here doing nothing for exactly that reason.
      # The coverage guard in vitest.config.ts catches a test file that matches
      # no project; these steps are what keep a *project* that no runner names
      # from silently dropping out the same way.
      - name: Unit tests
        run: pnpm exec vitest run --project=unit --project=web-unit

      # Covers integration-fast, integration-grouped, integration-shared and
      # integration-isolated — each name must stay in sync with package.json's
      # test:integration script and scripts/test-all.mjs. One invocation with
      # all four filters is safe: their sequence.groupOrder values (3→4→5→6)
      # make vitest run the projects sequentially, not in parallel (scripts/
      # test-all.mjs runs the same four as separate invocations for the same
      # reason).
      - name: Integration tests
        run: pnpm exec vitest run --project=integration-fast --project=integration-grouped --project=integration-shared --project=integration-isolated
